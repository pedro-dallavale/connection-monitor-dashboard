<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connection Monitor</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main>
    <h1>Dashboard de Monitoramento de Conexões</h1>
    <section class="cards">
      <article><h2>Status</h2><p id="status">-</p></article>
      <article><h2>Total de Eventos</h2><p id="total_events">0</p></article>
      <article><h2>Usuários Únicos</h2><p id="unique_users">0</p></article>
      <article><h2>Empresas Únicas</h2><p id="unique_companies">0</p></article>
    </section>

    <section>
      <h2>Último erro de conexão</h2>
      <p id="last_error">Sem erros.</p>
    </section>

    <section>
      <h2>Top Empresas</h2>
      <ul id="top_companies"></ul>
    </section>

    <section>
      <h2>Eventos recentes</h2>
      <table>
        <thead>
          <tr>
            <th>Horário log</th>
            <th>Usuário</th>
            <th>Empresa</th>
            <th>Capturado em (UTC)</th>
          </tr>
        </thead>
        <tbody id="recent_events"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/dashboard.js"></script>
</body>
</html>
